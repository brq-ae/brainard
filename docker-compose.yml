services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brain} -d ${POSTGRES_DB:-brain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set (see .env.example)}
      UI_SESSION_SECRET: ${UI_SESSION_SECRET:-}
      UI_COOKIE_SECURE: ${UI_COOKIE_SECURE:-false}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
      HUB_FALLBACK_URL: ${HUB_FALLBACK_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "${API_PORT:-8300}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Runs the test suite against a real Postgres database. Not started by
  # `docker compose up`; see docs/dev.md for the exact invocation.
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+asyncpg://brain:brain@db:5432/brain_test}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
