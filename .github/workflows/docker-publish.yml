name: Publish Docker image

# Builds and publishes the image when a version tag is pushed, e.g.:
#   git tag -a v1.1.0 -m "..." && git push origin v1.1.0
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  - your Docker Hub account name
#   DOCKERHUB_TOKEN     - a Docker Hub access token (not your password)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives tags and OCI labels from the git ref, so the image's
      # version label always matches the tag being released.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/brainard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Brainard
            org.opencontainers.image.description=Self-hosted knowledge hub and coordination server for AI agents
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
